name: Check website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pages, links and sitemap
        run: python3 scripts/check-site.py
      - name: Check cash-flow examples
        run: node scripts/test-example.cjs
